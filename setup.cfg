[flake8]
max-line-length = 110
# E203 and W503 disagree with black about slices and line breaks before
# binary operators. Black wins.
extend-ignore = E203,W503
exclude = .git,.venv,__pycache__,storage,evaluation/results

per-file-ignores =
    # The scripts and the harness put the repo root on sys.path before they
    # import from it, so their imports cannot sit at the top of the file.
    scripts/*.py:E402
    evaluation/harness.py:E402
    # guardrails.py holds the detection patterns as one aligned table. Wrapping
    # a regex across lines to satisfy a length limit makes it harder to read
    # and easier to get wrong, which is the opposite of what I want in the file
    # that decides whether a response reaches a customer.
    src/guardrails.py:E501

[tool:pytest]
testpaths = tests

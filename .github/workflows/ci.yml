name: ci

on:
  push:
  pull_request:

env:
  # No API key in CI, and none is needed: the offline provider forces the
  # degraded path, which is the same path the A11 tests exercise. If a key is
  # ever required here it comes from an encrypted repository secret and is
  # referenced as ${{ secrets.NAME }} - never written into this file.
  PROVIDER: offline

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest tests/ -v

      - name: Lint
        run: python -m flake8 src/ scripts/ evaluation/ tests/

      - name: Format check
        run: python -m black --check src/ scripts/ evaluation/ tests/

  gate:
    # The harness has to run unattended on a clean checkout, with no key and
    # nobody watching it. A slice of the validation set is enough to prove
    # that; the full run is a local target (make evaluate).
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Evaluation harness over a 20 ticket slice
        run: >
          python -m evaluation.harness
          --input data/validation_tickets.json
          --output evaluation/results/ci
          --limit 20

      - name: Keep the run output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-output
          path: evaluation/results/ci
          if-no-files-found: warn
